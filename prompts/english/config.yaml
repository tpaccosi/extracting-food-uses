# ---------------------------------------------------------------------------
# Frame groups (optional). Splits annotation into multiple smaller calls
# per sentence instead of one call covering all 7 frames at once -- useful
# when a model over-generates entities on the full schema (a lighter,
# more focused prompt per call often improves precision). Each call gets
# its own system prompt built ONLY from the frames in its group, via
# Schema.subset().
#
# Current setup: FOOD paired with exactly one other frame per call (six
# calls per sentence total). FOOD is included in every group because
# every other frame's core annotation move is "re-annotate what's
# already FOOD_LU" -- giving the model the FOOD_LU baseline alongside
# each frame keeps that instruction meaningful even in isolation.
#
# NOTE: splitting INGREDIENT and COOKING_CREATION into separate calls
# means they no longer see each other's definition in the same prompt.
# The boundary rule between COOKING_CREATION_Food_Material and
# INGR_Material_LU has been made self-contained in each frame's own
# `note` below (restated inline) specifically so it still works when
# split apart -- check those notes if you group them back together and
# want to trim the now-redundant restatement.
#
# If this key is omitted or empty, call_llms.py / call_llms_batch.py fall
# back to ONE call covering every frame at once.
groups:
  - [FOOD, DESCRIPTOR]
  - [FOOD, INGREDIENT]
  - [FOOD, COOKING_CREATION]
  - [FOOD, PRESERVING]
  - [FOOD, CURE]
  - [FOOD, INGESTION]

# ---------------------------------------------------------------------------
# Models to query. `provider` selects the adapter in call_llms.py.
# API keys are read from environment variables, never put them here.
# ---------------------------------------------------------------------------
models:
  - name: claude-opus-5
    provider: anthropic
    temperature: 0
  - name: claude-fable-5-1
    provider: anthropic
    temperature: 0
  - name: gpt-5.5
    provider: openai

max_retries: 2
